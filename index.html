<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musicalidad para bailarines</title>
<style>
  :root { --bg:#faf7f2; --fg:#222; --muted:#6b6b6b; --accent:#b4531f; --line:#e6dfd3; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header, main { max-width: 960px; margin: 0 auto; padding: 1.2rem; }
  h1 { margin-bottom:.2rem; } .sub { color:var(--muted); margin-top:0; }
  h2 { color:var(--accent); margin-top:2.2rem; }
  .hint { color:var(--muted); font-size:.9rem; margin-top:-.4rem; }

  /* Tarjetas que se voltean */
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:1rem; }
  .flip { perspective:1000px; background:none; border:0; padding:0; cursor:pointer; text-align:left;
          font:inherit; color:inherit; height:250px; }
  .flip:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:16px; }
  .inner { position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d; }
  .flip.on .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
          border-radius:16px; padding:1.1rem; display:flex; flex-direction:column; overflow:auto;
          box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .front { background:var(--c); color:#fff; align-items:center; justify-content:center; text-align:center; }
  .front .num { font-size:.8rem; opacity:.8; letter-spacing:.1em; }
  .front h3 { margin:.3rem 0; font-size:1.5rem; }
  .front p { margin:0; opacity:.92; font-size:.95rem; }
  .front .tap { margin-top:1rem; font-size:.75rem; opacity:.75; }
  .back { background:#fff; border:2px solid var(--c); transform:rotateY(180deg); font-size:.9rem; }
  .back h4 { margin:0 0 .4rem; color:var(--c); }
  .back p { margin:.2rem 0 .5rem; }
  .back b { color:var(--c); }
  .back a { margin-top:auto; color:var(--c); font-weight:600; font-size:.85rem; }

  #timeline { display:flex; height:46px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#eee; }
  #timeline div { display:flex; align-items:center; justify-content:center; font-size:.75rem; color:#fff; overflow:hidden; white-space:nowrap; }
  .empty { color:var(--muted); font-style:italic; }
  #selector { font:inherit; padding:.4rem .6rem; border:1px solid var(--line); border-radius:8px; background:#fff; margin-bottom:.4rem; }
  audio { width:100%; margin:.4rem 0; }
  #wave { position:relative; width:100%; height:170px; background:#fff; border:1px solid var(--line);
          border-radius:10px; cursor:pointer; overflow:hidden; touch-action:none; }
  #wave canvas { position:absolute; inset:0; width:100%; height:100%; }
  #ahora { font-weight:600; margin:.5rem 0 0; }
  #tip { position:absolute; top:4px; padding:1px 6px; font-size:.75rem; background:#222; color:#fff;
         border-radius:4px; pointer-events:none; display:none; }
  @media (prefers-reduced-motion: reduce) { .inner { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>Musicalidad para bailarines</h1>
  <p class="sub">Frase, bloque, puente, intro, coda, síncopa y anacrusa.</p>
</header>
<main>
  <h2>Conceptos</h2>
  <p class="hint">Toca una tarjeta para ver su definición.</p>
  <div class="grid" id="conceptos"></div>

  <h2 id="cancion-titulo">Canciones analizadas</h2>
  <select id="selector" aria-label="Elegir canción"></select>
  <p id="meta"></p>
  <div id="wave"><canvas id="cv"></canvas><span id="tip"></span></div>
  <audio id="audio" controls preload="metadata"></audio>
  <p id="ahora"></p>
  <p id="aviso" class="empty"></p>
  <p class="hint">Haz clic en la onda para saltar a ese punto. Las líneas finas marcan compases; las gruesas, cada 8 compases.</p>
</main>
<script>
// [título, pista corta, definición, cómo reconocerlo, ficha, color]
const conceptos = [
  ["Compás","¿Cómo se agrupan los pulsos?",
   "Forma en que se agrupan los pulsos en ciclos que se repiten. En zouk y kizomba lo habitual es el 4/4.",
   "Marca el pulso con el pie y di «1» cada vez que sientas que vuelve a empezar.",
   "00-base-pulso-y-compas","#2f6f8f"],
  ["Anacrusa","Lo que suena antes del 1",
   "Nota o notas que suenan antes del primer tiempo fuerte: una toma de impulso que aterriza en el 1.",
   "La voz o un instrumento entra justo antes de lo esperado y el «1» llega después.",
   "01-anacrusa","#c0562b"],
  ["Síncopa","Acento donde no se espera",
   "Acento en un tiempo débil o entre tiempos que se alarga sobre el siguiente fuerte, que queda sin golpe.",
   "Sientes un empujón o un tirón: la música se adelanta o se queda en el aire.",
   "02-sincopa","#8a4fb0"],
  ["Frase musical","Una idea con principio y cierre",
   "Unidad de sentido con principio, desarrollo y cierre. Suele ocupar 2 o 4 compases.",
   "La melodía respira: pausa, descenso o nota larga al final.",
   "03-frase-musical","#2e8b57"],
  ["Bloque musical","Frases que forman una unidad",
   "Agrupación de frases con dirección propia: estrofa, estribillo o parte instrumental.",
   "Cambia algo perceptible: instrumentos, intensidad, silencio o patrón rítmico.",
   "04-bloque-musical","#c28a00"],
  ["Intro","Cómo arranca la canción",
   "Sección que abre la canción antes de la primera parte cantada y presenta ambiente y tempo.",
   "Suena antes de que entre la voz; puede ser solo ritmo o un instrumento.",
   "05-intro","#3a7ca5"],
  ["Puente","El cambio de paisaje",
   "Sección contrastante, normalmente hacia el final, con material nuevo: otra melodía, ritmo o energía.",
   "Tras varias repeticiones, algo deja de ser lo mismo. Suele volver al estribillo después.",
   "06-puente","#b5446e"],
  ["Coda","El cierre final",
   "Sección que cierra la canción tras la última repetición del material principal.",
   "Estribillo variado, ralentización, parada brusca, fade-out o vuelta a la intro.",
   "07-coda","#555e6b"]
];
document.getElementById('conceptos').innerHTML = conceptos.map(([t,p,d,r,f,c],i) => `
  <button class="flip" style="--c:${c}" aria-pressed="false" aria-label="${t}: tocar para voltear">
    <div class="inner">
      <div class="face front">
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <h3>${t}</h3><p>${p}</p><span class="tap">toca para voltear ↻</span>
      </div>
      <div class="face back">
        <h4>${t}</h4>
        <p>${d}</p>
        <p><b>Cómo reconocerlo:</b> ${r}</p>
        <a href="docs/${f}.md" onclick="event.stopPropagation()">Ficha completa →</a>
      </div>
    </div>
  </button>`).join('');
document.querySelectorAll('.flip').forEach(b => b.addEventListener('click', () => {
  const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on);
}));

const colores = {intro:'#6c8ebf', estrofa:'#82a66a', estribillo:'#b4531f', puente:'#8a6bb4', coda:'#555'};
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

const CANCIONES = [
  ['o-meu-lugar', 'O Meu Lugar — 7AL3M'],
  ['o-vento-traz-o-teu-perfume', 'O vento traz o teu perfume — vjgalaxy']
];
const au = document.getElementById('audio'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const wave = document.getElementById('wave'), tip = document.getElementById('tip');
const sel = document.getElementById('selector');
sel.innerHTML = CANCIONES.map(([id,t]) => `<option value="${id}">${t}</option>`).join('');
let d = null, pk = null;
const dur = () => pk.duracion_s, L = () => d.duracion_compas_s;
const secAt = t => [...d.secciones].reverse().find(s => t >= s.inicio_s) || d.secciones[0];

function draw() {
  if (!d) return;
  const dpr = window.devicePixelRatio || 1, W = wave.clientWidth, H = wave.clientHeight, D = dur();
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const x = t => t / D * W;
  d.secciones.forEach((s,i) => {
    const fin = d.secciones[i+1]?.inicio_s ?? D, c = colores[s.tipo] || '#999';
    ctx.fillStyle = c + '33'; ctx.fillRect(x(s.inicio_s), 0, x(fin) - x(s.inicio_s), H);
    ctx.fillStyle = c; ctx.fillRect(x(s.inicio_s), 0, 2, H);
    ctx.font = '600 12px system-ui'; ctx.textBaseline = 'top'; ctx.fillText(s.nombre, x(s.inicio_s) + 5, 4);
  });
  for (let n = 1; n*L() < D; n++) {
    ctx.strokeStyle = n % 8 === 0 ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.10)';
    ctx.lineWidth = n % 8 === 0 ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(x(n*L()), 0); ctx.lineTo(x(n*L()), H); ctx.stroke();
  }
  const N = pk.max.length, mid = H*0.58, amp = H*0.34;
  ctx.fillStyle = '#2b2b2b';
  for (let px = 0; px < W; px++) {
    const i = Math.min(N-1, Math.floor(px / W * N));
    const top = mid - pk.max[i]*amp, bot = mid - pk.min[i]*amp;
    ctx.fillRect(px, top, 1, Math.max(1, bot - top));
  }
  ctx.fillStyle = '#e11'; ctx.fillRect(x(au.currentTime) - 1, 0, 2, H);
}
function actualizar() {
  if (!d) return;
  const s = secAt(au.currentTime), c = Math.floor(au.currentTime / L()) + 1;
  document.getElementById('ahora').textContent = `${mmss(Math.floor(au.currentTime))} · ${s.nombre} · compás ${c}`;
  draw();
}
const tick = () => { actualizar(); if (!au.paused) requestAnimationFrame(tick); };
au.addEventListener('play', tick);
['pause','seeked','timeupdate','loadedmetadata'].forEach(e => au.addEventListener(e, actualizar));
au.addEventListener('error', () => {
  if (d) document.getElementById('aviso').textContent =
    `No se encuentra el audio (${d.audio}). Copia el mp3 en esa ruta para poder reproducirlo.`;
});
window.addEventListener('resize', draw);
const tDe = ev => Math.max(0, Math.min(dur(), (ev.clientX - wave.getBoundingClientRect().left) / wave.clientWidth * dur()));
wave.addEventListener('click', ev => { if (d) au.currentTime = tDe(ev); });
wave.addEventListener('mousemove', ev => {
  if (!d) return; const t = tDe(ev); tip.style.display = 'block';
  tip.style.left = Math.min(wave.clientWidth - 60, ev.clientX - wave.getBoundingClientRect().left + 8) + 'px';
  tip.textContent = `${mmss(Math.floor(t))} · c.${Math.floor(t / L()) + 1}`;
});
wave.addEventListener('mouseleave', () => tip.style.display = 'none');

function cargar(id) {
  au.pause();
  Promise.all([fetch(`data/${id}.json`).then(r => r.json()), fetch(`data/${id}-peaks.json`).then(r => r.json())])
  .then(([dd, pp]) => {
    d = dd; pk = pp;
    document.getElementById('aviso').textContent = '';
    document.getElementById('meta').innerHTML =
      `Duración ${mmss(Math.round(dur()))} · ${d.bpm} BPM · Compás ${d.compas} · ` +
      `<a href="${d.enlace}" target="_blank" rel="noopener">ver origen</a>` +
      (d.credito ? `<br><small>${d.credito}</small>` : '');
    au.src = d.audio; au.currentTime = 0;
    actualizar();
  });
}
sel.addEventListener('change', () => cargar(sel.value));
cargar(CANCIONES[0][0]);
</script>
</body>
</html>
